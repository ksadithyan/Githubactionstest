name: CI Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest test_app.py

  build-and-push:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 1. Create the unique identifier (Standardized to sha_short)
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 2. Build the image (Using the standardized sha_short)
      - name: Build Docker image
        run: |
          docker build -t devops-intern-app:${{ steps.vars.outputs.sha_short }} .
        
      # 3. Run Trivy (Using the correct action name and parameter)
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-intern-app:${{ steps.vars.outputs.sha_short }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # 4. Push the image (Using the standardized sha_short at all places)
      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: github-actions-testapp
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag devops-intern-app:${{ steps.vars.outputs.sha_short }} $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

# current test - test 2 - pipeline - update the AWS policy to allow the role to assume the ECR push permissions.